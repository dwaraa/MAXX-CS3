name: Build and Publish Cloudstream Plugins

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson
          mkdir -p dist
          cp */build/*.cs3 dist/ || cp **/build/*.cs3 dist/ || true
          cp build/plugins.json dist/ || true
          cp repo.json dist/ || true

      - name: Deploy to builds branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: builds
          FOLDER: dist
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Auto-build plugins for Cloudstream: ${GITHUB_SHA}"

      - name: Purge jsDelivr CDN Cache
        run: |
          sleep 5
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/plugins.json" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/TamilDhool.cs3" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/Einthusan.cs3" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/TamilUltra.cs3" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/repo.json" || true
